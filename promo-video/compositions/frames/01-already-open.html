<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Hanken Grotesk";
          src: url("/assets/fonts/HankenGrotesk_700Bold.ttf") format("truetype");
          font-weight: 700;
          font-display: block;
        }
        @font-face {
          font-family: "Hanken Grotesk";
          src: url("/assets/fonts/HankenGrotesk_500Medium.ttf") format("truetype");
          font-weight: 500;
          font-display: block;
        }
        @font-face {
          font-family: "Space Grotesk";
          src: url("/assets/fonts/SpaceGrotesk_700Bold.ttf") format("truetype");
          font-weight: 700;
          font-display: block;
        }

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #ffffff;
        }
        .ambient-glow {
          position: absolute;
          left: 62%;
          top: 48%;
          width: 1100px;
          height: 1100px;
          transform: translate(-50%, -50%);
          background: radial-gradient(circle, rgba(46, 204, 113, 0.18) 0%, rgba(31, 138, 91, 0.08) 45%, rgba(255, 255, 255, 0) 75%);
          filter: blur(65px);
          pointer-events: none;
        }

        .phone-wrapper {
          position: absolute;
          left: 780px;
          top: 100px;
          width: 442px;
          height: 880px;
        }

        /* iPhone 17 Pro Frame */
        .phone {
          position: relative;
          width: 442px;
          height: 880px;
          padding: 12px;
          border-radius: 54px;
          background: #1c2420;
          box-shadow:
            0 35px 70px -10px rgba(0, 0, 0, 0.22),
            0 0 45px rgba(31, 138, 91, 0.15),
            inset 0 0 2px 1.5px rgba(255, 255, 255, 0.2);
        }
        .phone .screen {
          position: relative;
          width: 418px;
          height: 856px;
          border-radius: 44px;
          overflow: hidden;
          background: #eef1ee;
        }
        .screen-gloss {
          position: absolute;
          left: 0;
          top: 0;
          right: 0;
          height: 45%;
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 60%);
          pointer-events: none;
          z-index: 25;
        }
        .safe {
          position: absolute;
          left: 0;
          top: 0;
          right: 0;
          height: 44px;
          z-index: 20;
          pointer-events: none;
        }
        .island {
          position: absolute;
          left: 50%;
          top: 10px;
          transform: translateX(-50%);
          width: 110px;
          height: 30px;
          border-radius: 15px;
          background: #0a0d0b;
        }

        /* iPhone 17 Pro Side Buttons */
        .btn { position: absolute; width: 4px; background: #1c2420; }
        .btn.l { left: -4px; border-radius: 3px 0 0 3px; }
        .btn.r { right: -4px; border-radius: 0 3px 3px 0; }

        .statusbar {
          position: absolute;
          left: 0;
          top: 0;
          width: 418px;
          height: 44px;
          z-index: 20;
          pointer-events: none;
        }
        .status-time {
          position: absolute;
          left: 28px;
          top: 15px;
          font-family: "Hanken Grotesk", sans-serif;
          font-weight: 700;
          font-size: 14px;
          color: #16201b;
        }
        .status-dots {
          position: absolute;
          right: 28px;
          top: 18px;
          width: 46px;
          height: 11px;
          border-radius: 3px;
          background: rgba(20, 40, 30, 0.22);
        }

        .screen-body {
          position: absolute;
          left: 0;
          top: 44px;
          width: 418px;
          height: 812px;
          overflow: hidden;
          box-sizing: border-box;
        }

        .shot-img {
          width: 418px;
          height: 812px;
          display: block;
          object-fit: fill;
          border-radius: 0 0 44px 44px;
        }

        /* Tactile Press Highlight on Add Button */
        .add-tap-feedback {
          position: absolute;
          left: 209px;
          top: 794px;
          width: 54px;
          height: 54px;
          border-radius: 50%;
          transform: translate(-50%, -50%) scale(1);
          background: rgba(22, 95, 60, 0.4);
          opacity: 0;
          pointer-events: none;
          z-index: 24;
        }

        /* Interactive Tap Cursor on Add Button */
        .cursor-pointer {
          position: absolute;
          left: 209px;
          top: 794px;
          transform: translate(-50%, -50%);
          pointer-events: none;
          z-index: 30;
          opacity: 0;
        }
        .cursor-dot {
          width: 34px;
          height: 34px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.95);
          border: 2px solid #16201b;
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .cursor-dot::after {
          content: '';
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #1f8a5b;
        }
        .cursor-ripple {
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          width: 70px;
          height: 70px;
          border-radius: 50%;
          border: 2.5px solid #1f8a5b;
          background: rgba(31, 138, 91, 0.25);
          opacity: 0;
          pointer-events: none;
        }

        /* Kinetic Typography Card */
        .title-card {
          position: absolute;
          left: 130px;
          top: 380px;
          width: 580px;
          display: flex;
          flex-direction: column;
          gap: 16px;
          z-index: 10;
        }
        .kinetic-headline {
          font-family: "Hanken Grotesk", sans-serif;
          font-weight: 700;
          font-size: 60px;
          line-height: 1.15;
          letter-spacing: -0.03em;
          color: #111814;
        }
        .kinetic-word {
          display: inline-block;
          opacity: 0;
          filter: blur(6px);
          transform: translateY(20px);
          will-change: transform, opacity, filter;
        }
        .kinetic-accent {
          color: #1f8a5b;
          text-shadow: 0 0 28px rgba(31, 138, 91, 0.25);
        }
        .kinetic-sub {
          font-family: "Hanken Grotesk", sans-serif;
          font-weight: 500;
          font-size: 24px;
          line-height: 1.4;
          color: #4b5563;
          opacity: 0;
          filter: blur(6px);
          transform: translateY(16px);
          will-change: transform, opacity, filter;
        }
      </style>

      <div
        id="root"
        data-composition-id="01-already-open"
        data-start="0"
        data-duration="2.95"
        data-width="1920"
        data-height="1080"
      >
        <div class="ambient-glow" id="f1-glow" data-layout-allow-overflow></div>

        <!-- Kinetic Headline Card -->
        <div class="title-card">
          <div class="kinetic-headline">
            <span class="kinetic-word" id="f1-w1">Know</span>
            <span class="kinetic-word" id="f1-w2">your</span>
            <span class="kinetic-word kinetic-accent" id="f1-w3">money.</span>
          </div>
          <div class="kinetic-sub" id="f1-sub">
            Tap to scan any receipt, e-wallet, or statement.
          </div>
        </div>

        <!-- iPhone 17 Pro Mockup with Actual Home Dashboard -->
        <div class="phone-wrapper" id="f1-phone-wrapper">
          <div class="phone">
            <!-- Buttons -->
            <i class="btn l" style="top: 132px; height: 32px"></i>
            <i class="btn l" style="top: 188px; height: 55px"></i>
            <i class="btn l" style="top: 254px; height: 55px"></i>
            <i class="btn r" style="top: 204px; height: 85px"></i>
            <i class="btn r" style="top: 318px; height: 40px"></i>

            <div class="screen">
              <div class="screen-gloss"></div>
              <div class="safe"><i class="island"></i></div>

              <div class="statusbar">
                <div class="status-time">9:41</div>
                <div class="status-dots"></div>
              </div>

              <!-- Actual Home Screen Image (Clean Fitted) -->
              <div class="screen-body">
                <img class="shot-img" data-layout-allow-overflow src="/assets/screenshots/01_home_dashboard_clean.png" alt="Pip Home Dashboard" />
              </div>

              <!-- Tactile Button Feedback -->
              <div class="add-tap-feedback" id="f1-add-feedback"></div>

              <!-- Touch Cursor on Add Button -->
              <div class="cursor-pointer" id="f1-cursor">
                <div class="cursor-dot" id="f1-cursor-dot"></div>
                <div class="cursor-ripple" id="f1-ripple"></div>
              </div>

            </div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Clean initial entrance
        tl.fromTo(
          "#f1-phone-wrapper",
          { opacity: 0, scale: 0.96 },
          { opacity: 1, scale: 1.0, duration: 0.5, ease: "power3.out" },
          0
        );

        // Kinetic text staggered blur-to-crisp reveal
        const words = ["#f1-w1", "#f1-w2", "#f1-w3"];
        words.forEach((w, i) => {
          tl.to(
            w,
            {
              opacity: 1,
              filter: "blur(0px)",
              y: 0,
              duration: 0.4,
              ease: "power3.out",
            },
            0.1 + i * 0.1
          );
        });

        tl.to(
          "#f1-sub",
          {
            opacity: 1,
            filter: "blur(0px)",
            y: 0,
            duration: 0.45,
            ease: "power3.out",
          },
          0.45
        );

        // Cursor glides in towards the center Add (+) button (209px, 794px)
        tl.fromTo(
          "#f1-cursor",
          { opacity: 0, x: 80, y: 50 },
          { opacity: 1, x: 0, y: 0, duration: 0.9, ease: "power2.out" },
          0.6
        );

        // Cursor taps down on the Add button at 1.85s
        tl.to(
          "#f1-cursor-dot",
          { scale: 0.85, duration: 0.12, ease: "power2.in" },
          1.85
        );
        tl.to(
          "#f1-add-feedback",
          { opacity: 1, scale: 0.94, duration: 0.12, ease: "power2.in" },
          1.85
        );

        // Ripple expansion on button press
        tl.fromTo(
          "#f1-ripple",
          { opacity: 0.9, scale: 0.4 },
          { opacity: 0, scale: 1.6, duration: 0.3, ease: "power2.out" },
          1.92
        );

        // Subtle gentle drift over the 2.95s duration (including +0.8s hold after tap)
        tl.to(
          "#f1-phone-wrapper",
          {
            y: -4,
            duration: 2.95,
            ease: "sine.inOut",
          },
          0.5
        );

        window.__timelines["01-already-open"] = tl;
      </script>
    </template>
  </body>
</html>
