      <script>

        wordsA.forEach((w, i) => {
          tl.to(
            w,

              opacity: 1,
              filter: "blur(0px)",
              y: 0,
              duration: 0.45,
              ease: "power3.out",

            0.15 + i * 0.12

        });
        tl.to(
          "#f2-sub-a",

            filter: "blur(0px)",

        // SHOT 1: Tap to Scan (0.0s - 1.4s)

        tl.to("#f2-shot1", { opacity: 0, duration: 0.2, ease: "power2.inOut" }, 1.35);

        // SHOT 2: Single-pass Reading / Scanning (1.35s - 2.95s)
        tl.fromTo("#f2-shot2", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.4);

        // Single pass: laser moves through the image ONCE and then moves to found it
        tl.fromTo(
          "#f2-scanline",
          { y: 0 },
          { y: 600 - 28, duration: 1.2, ease: "power1.inOut" },
          1.6
        );
        tl.call(() => { document.getElementById("f2-read-secs").textContent = " (1.1s)"; }, null, 2.4);
        tl.to("#f2-shot2", { opacity: 0, duration: 0.2, ease: "power2.inOut" }, 2.9);

        // Transition Title A to Title B (around 2.9s)
        tl.to(
          "#f2-card-a",
          {
            opacity: 0,
            filter: "blur(6px)",
            y: -16,
            duration: 0.35,
            ease: "power2.in",
            onComplete: () => {
              document.getElementById("f2-card-a").style.display = "none";
              document.getElementById("f2-card-b").style.display = "flex";
            }
          },
          2.9
        );

        // SHOT 3: Found it (2.95s - 5.5s)
        tl.fromTo("#f2-shot3", { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 2.95);

        // Reveal Title B
        const wordsB = ["#f2-wb1", "#f2-wb2", "#f2-wb3"];
        wordsB.forEach((w, i) => {
          tl.to(
            w,
            {
              opacity: 1,
              filter: "blur(0px)",
              y: 0,
              duration: 0.45,
              ease: "power3.out",
            },
            3.2 + i * 0.12
          );

        tl.to(
          "#f2-sub-b",
          {
            opacity: 1,
            filter: "blur(0px)",
            y: 0,
            duration: 0.45,
            ease: "power3.out",
          },
          3.6
        );

        const ROWS = ["#f2-irow0", "#f2-irow1", "#f2-irow2", "#f2-irow3", "#f2-irow4"];
        ROWS.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 3.2 + i * 0.08);
        });
        tl.to("#f2-sort-btn", { scale: 0.96, duration: 0.12, ease: "power2.out" }, 5.1);
        tl.to("#f2-sort-btn", { scale: 1, duration: 0.16, ease: "elastic.out(1, 0.4)" }, 5.22);
        tl.to("#f2-shot3", { opacity: 0, duration: 0.2, ease: "power2.inOut" }, 5.45);

        // SHOT 4a: Categorize full detail (5.5s - 7.0s)

        tl.fromTo("#f2-chip-check", { scale: 0 }, { scale: 1.2, duration: 0.16, ease: "back.out(2)" }, 5.85);
        tl.to("#f2-chip-check", { scale: 1, duration: 0.1, ease: "power2.out" }, 6.01);
        tl.to("#f2-confirm-btn", { scale: 0.96, duration: 0.12, ease: "power2.out" }, 6.55);
        tl.to("#f2-confirm-btn", { scale: 1, duration: 0.16, ease: "elastic.out(1, 0.4)" }, 6.67);
        tl.to("#f2-shot4a", { opacity: 0, duration: 0.2, ease: "power2.inOut" }, 6.95);

        // SHOT 4b: Confirms Whip Sequence (7.0s - 9.2s)

            counterEl.textContent = w.n;
            merchantEl.textContent = w.m;
            amtEl.textContent = w.a;

          tl.fromTo("#f2-whip-check", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.2, duration: 0.12, ease: "back.out(2.4)" }, t0);
          tl.to("#f2-whip-check", { scale: 1.0, duration: 0.06, ease: "power2.out" }, t0 + 0.12);
          tl.to("#f2-whip-check", { opacity: 0, scale: 0.8, duration: 0.1, ease: "power2.in" }, t0 + 0.18);
        });

        // Clear titles and transition
        tl.to(
          "#f2-card-b",
          {
            opacity: 0,
            filter: "blur(6px)",
            y: -16,
            duration: 0.35,
            ease: "power2.in",

        );

          "#f2-phone-wrapper",

            duration: 0.35,
            ease: "power2.in",
