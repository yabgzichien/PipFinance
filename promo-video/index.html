<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="19.35"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-already-open"
        class="scene"
        data-composition-id="01-already-open"
        data-composition-src="compositions/frames/01-already-open.html"
        data-start="0"
        data-duration="2.95"
        data-track-index="0"
      ></div>

      <div
        id="el-02-the-lift"
        class="scene"
        data-composition-id="02-the-lift"
        data-composition-src="compositions/frames/02-the-lift.html"
        data-start="2.95"
        data-duration="9.6"
        data-track-index="1"
      ></div>

      <div
        id="el-03-the-number"
        class="scene"
        data-composition-id="03-the-number"
        data-composition-src="compositions/frames/03-the-number.html"
        data-start="12.55"
        data-duration="3.0"
        data-track-index="0"
      ></div>

      <div
        id="el-04-close"
        class="scene"
        data-composition-id="04-close"
        data-composition-src="compositions/frames/04-close.html"
        data-start="15.55"
        data-duration="3.8"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="19.35"
        data-track-index="11"
        data-volume="0.65"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];
        // Instant screen reaction on tap at 2.95s (zero fade on phone frame)
        tl.set("#el-01-already-open", { opacity: 0 }, 2.95);
        tl.set("#el-02-the-lift", { opacity: 1 }, 2.95);
        tl.to("#el-02-the-lift", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 12.55);
        tl.fromTo("#el-03-the-number", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 12.55);
        tl.to("#el-03-the-number", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 15.55);
        tl.fromTo("#el-04-close", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 15.55);
        tl.to({}, { duration: 19.35 }, 0);
      })();
    </script>
  </body>
</html>
